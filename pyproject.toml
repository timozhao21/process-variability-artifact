[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "spaghetti-process-experiment"
version = "0.1.0"
description = "Reproducible comparison of imperative and declarative process discovery"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.10.9",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "pm4py==2.7.22.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

